<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>뉴베리프 NEUVELIF</title>
<meta name="robots" content="noindex">
<link rel="canonical" href="https://neuvelif.com/">
<!-- 자바스크립트가 꺼져 있어도 0초 뒤 새 사이트로 이동 -->
<meta http-equiv="refresh" content="0; url=https://neuvelif.com/">
<script>
  // 예전 모바일 주소(m.neuvelif.com/…)로 들어오면 같은 경로를 붙여 neuvelif.com 으로 보냅니다.
  location.replace('https://neuvelif.com' + location.pathname + location.search + location.hash);
</script>
</head>
<body>
<p><a href="https://neuvelif.com/">뉴베리프 사이트로 이동합니다</a></p>
</body>
</html>
